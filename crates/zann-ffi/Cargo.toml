[package]
name = "zann-ffi"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

# `crate-type` belongs to [lib]; under [package] cargo ignores it and never
# builds the shared library the uniffi bindings load.
[lib]
crate-type = ["cdylib", "rlib"]

# The binding generator pulls in clap; it stays out of the library graph that
# shells link.
[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[features]
test-support = ["zann-client-sqlite/test-support"]
bindgen = ["uniffi/cli"]

[dependencies]
zann-flows = { path = "../zann-flows" }
thiserror = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time"] }
uniffi = "0.28"
zann-client = { path = "../zann-client", default-features = false, features = ["app"] }
zann-client-sqlite = { path = "../zann-client-sqlite", features = ["local-vault"] }
zann-ui-core = { path = "../zann-ui-core" }

[dev-dependencies]
zann-ffi = { path = ".", features = ["test-support"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
zann-daemon = { path = "../zann-daemon" }
