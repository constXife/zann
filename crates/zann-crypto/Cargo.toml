[package]
name = "zann-crypto"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
spake2 = { version = "0.4", optional = true }
snow = { version = "0.10", optional = true, default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
argon2 = "0.5"
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
proptest = "1.5.0"

[features]
default = []
ipc-transport = ["dep:snow"]
ipc-pairing = ["dep:spake2"]
