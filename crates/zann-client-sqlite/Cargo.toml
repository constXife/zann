[package]
name = "zann-client-sqlite"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt"] }
uuid = { version = "1", features = ["v7"] }
zann-client = { path = "../zann-client", default-features = false, features = ["app"] }
zann-core = { path = "../zann-core", default-features = false }
zann-crypto = { path = "../zann-crypto" }
zann-db = { path = "../zann-db", default-features = false, features = ["sqlite"] }

anyhow = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
csv = { version = "1", optional = true }
percent-encoding = { version = "2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "1", optional = true }
url = { version = "2", optional = true }
zann-keystore = { path = "../zann-keystore", optional = true }

[features]
default = []
local-vault = [
  "dep:anyhow", "dep:base64", "dep:chrono", "dep:csv", "dep:percent-encoding",
  "dep:serde", "dep:serde_json", "dep:thiserror", "dep:url", "dep:zann-keystore",
  "zann-client/os-credentials", "tokio/rt-multi-thread", "tokio/sync",
]

[dev-dependencies]
chrono = "0.4"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
