[package]
name = "zann-ui-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
data-encoding = "2"
getrandom = { version = "0.2", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
totp-rs = "5"
url = "2"
zeroize = "1"
zann-autofill = { path = "../zann-autofill" }
zann-core = { path = "../zann-core", default-features = false }
