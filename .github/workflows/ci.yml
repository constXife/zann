name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      rust: ${{ steps.filter.outputs.rust }}
      server: ${{ steps.filter.outputs.server }}
      docker: ${{ steps.filter.outputs.docker }}
      audit_surface: ${{ steps.filter.outputs.audit_surface }}
      client_architecture: ${{ steps.filter.outputs.client_architecture }}
      shared_clients: ${{ steps.filter.outputs.shared_clients }}
      apple: ${{ steps.filter.outputs.apple }}
      cosmic: ${{ steps.filter.outputs.cosmic }}
      extension: ${{ steps.filter.outputs.extension }}
      nix_module: ${{ steps.filter.outputs.nix_module }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - '**/*.md'
              - '.github/pull_request_template.md'
              - '.github/ISSUE_TEMPLATE/**'
            rust:
              - 'crates/**'
              - 'tests/fixtures/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'rust-toolchain.toml'
            server:
              - 'crates/zann-server/**'
              - 'crates/zann-crypto/**'
              - 'crates/zann-core/**'
              - 'crates/zann-db/**'
              - 'crates/zann-integration-tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'config/*.yaml'
              - 'compose.yaml'
            docker:
              - 'crates/zann-server/Dockerfile'
              - 'crates/zann-crypto/**'
              - 'crates/zann-core/**'
              - 'crates/zann-db/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.dockerignore'
              - 'compose.yaml'
              - '.env.example'
              - 'Justfile'
              - 'scripts/dev-up.sh'
            extension:
              - 'apps/extension/**'
              - 'crates/zann-browser/**'
              - 'crates/zann-client/**'
              - 'crates/zann-client-sqlite/**'
              - 'crates/zann-daemon/**'
              - 'crates/zann-native-host/**'
              - 'crates/zann-autofill/**'
              - 'crates/zann-crypto/**'
              - 'crates/zann-core/**'
              - 'crates/zann-db/**'
              - 'crates/zann-ui-core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            audit_surface:
              - 'crates/zann-flows/**'
              - 'crates/zann-ffi/src/connect_flow.rs'
              - 'crates/zann-ffi/src/connect_flow/**'
              - 'crates/zann-ffi/tests/connect_flow.rs'
              - 'crates/zann-ui-core/src/generator/**'
              - 'crates/zann-ffi/src/generator.rs'
              - 'crates/zann-ffi/tests/generator.rs'
              - 'apps/extension/**'
              - 'crates/zann-browser/**'
              - 'crates/zann-ui-core/src/filter.rs'
              - 'crates/zann-ui-core/src/login_list.rs'
              - 'crates/zann-client/src/browser_ipc.rs'
              - 'crates/zann-client/src/browser_ipc/**'
              - 'crates/zann-db/src/services/create_item.rs'
              - 'crates/zann-db/src/local/item_history_repo.rs'
              - 'crates/zann-client/src/native_messaging.rs'
              - 'crates/zann-native-host/**'
              - 'crates/zann-db/src/services/browser.rs'
              - 'crates/zann-db/src/local/item_repo/browser.rs'
              - 'crates/zann-db/migrations/0006_browser_login_index.sql'
              - 'crates/zann-core/src/constants.rs'
              - 'crates/zann-daemon/**'
              - 'crates/zann-autofill/**'
              - 'crates/zann-crypto/**'
              - 'tests/fixtures/crypto/**'
              - 'crates/zann-core/src/auth.rs'
              - 'crates/zann-core/src/item_metadata.rs'
              - 'crates/zann-db/src/services/create_item.rs'
              - 'crates/zann-db/migrations/0005_item_metadata.sql'
              - 'crates/zann-core/src/api/auth.rs'
              - 'crates/zann-client/src/config.rs'
              - 'crates/zann-client/src/config/locking.rs'
              - 'crates/zann-client/src/config/v2.rs'
              - 'crates/zann-client/src/config/v2/**'
              - 'crates/zann-client/src/credentials.rs'
              - 'crates/zann-client/src/identity.rs'
              - 'crates/zann-client/src/probe.rs'
              - 'crates/zann-client/src/remote.rs'
              - 'crates/zann-client/src/server.rs'
              - 'crates/zann-client/src/server/**'
              - 'crates/zann-client/src/remote/auth.rs'
              - 'crates/zann-client/src/remote/trust.rs'
              - 'crates/zann-client/src/session.rs'
              - 'crates/zann-client/src/app.rs'
              - 'crates/zann-client/src/app/**'
              - 'crates/zann-client/src/sync/**'
              - 'crates/zann-client/tests/config_v2.rs'
              - 'crates/zann-client-sqlite/**'
              - 'crates/zann-db/src/lib.rs'
              - 'crates/zann-db/src/local/bounded_read.rs'
              - 'crates/zann-db/src/local/item_repo.rs'
              - 'crates/zann-db/src/local/mod.rs'
              - 'crates/zann-db/src/local/pending_change_repo.rs'
              - 'crates/zann-db/src/local/storage_repo.rs'
              - 'crates/zann-db/src/local/sync_cursor_repo.rs'
              - 'crates/zann-db/src/local/sync_repo.rs'
              - 'crates/zann-db/src/local/sync_repo/**'
              - 'crates/zann-db/src/local/maintenance.rs'
              - 'crates/zann-db/src/domain_row.rs'
              - 'crates/zann-db/src/local/vault_repo.rs'
              - 'crates/zann-core/src/item_subtitle.rs'
              - 'crates/zann-db/src/services/mod.rs'
              - 'crates/zann-db/src/services/items.rs'
              - 'crates/zann-db/migrations/0002_sync_cursor_last_seq.sql'
              - 'crates/zann-db/migrations/0004_server_replicas.sql'
              - 'crates/zann-db/tests/local_sqlite_path.rs'
              - 'crates/zann-db/tests/local_sync_transactions.rs'
              - 'crates/zann-db/tests/local_vault_migration.rs'
              - 'crates/zann-db/tests/server_replicas_migration.rs'
              - 'crates/zann-server/src/domains/auth/core/**'
              - 'crates/zann-server/src/domains/access_control/**'
              - 'crates/zann-server/src/infra/audit.rs'
              - 'crates/zann-server/src/domains/backup/**'
              - 'crates/zann-server/src/cli/export.rs'
              - 'crates/zann-server/src/cli/import.rs'
              - 'crates/zann-server/tests/shared_backup.rs'
              - 'crates/zann-server/tests/shared_backup/**'
              - 'crates/zann-db/src/repo/backup.rs'
              - 'crates/zann-db/src/repo/items.rs'
              - 'crates/zann-db/src/repo/vaults.rs'
              - 'crates/zann-db/src/repo/devices.rs'
              - 'crates/zann-db/src/local/item_repo/**'
              - 'crates/zann-db/src/local/item_history_repo.rs'
              - 'crates/zann-db/tests/local_payload_versions.rs'
              - 'crates/zann-server/src/domains/items/payload_admission.rs'
              - 'crates/zann-server/src/domains/items/http/v1/mod.rs'
              - 'crates/zann-server/src/domains/vaults/http/v1/shared/handlers/items.rs'
              - 'crates/zann-server/src/domains/items/service.rs'
              - 'crates/zann-server/src/domains/secrets/service.rs'
              - 'crates/zann-server/src/domains/sync/service.rs'
              - 'crates/zann-server/src/domains/sync/http/v1/handlers/push_apply.rs'
              - 'crates/zann-server/src/domains/vaults/http/v1/shared/handlers/rotation_commit.rs'
              - 'crates/zann-keystore/**'
            # The architecture guard is intentionally cheap. Run it whenever a
            # client shell, a shared capability, or their dependency manifests
            # change so ownership rules cannot silently drift.
            client_architecture:
              - 'crates/zann-native-host/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**/Cargo.toml'
              - 'crates/zann-client/**'
              - 'crates/zann-client-sqlite/**'
              - 'crates/zann-cli/**'
              - 'crates/zann-core/**'
              - 'crates/zann-daemon/**'
              - 'crates/zann-autofill/**'
              - 'crates/zann-crypto/**'
              - 'crates/zann-db/**'
              - 'crates/zann-ffi/**'
              - 'crates/zann-flows/**'
              - 'crates/zann-keystore/**'
              - 'crates/zann-ui-core/**'
              - 'apps/cosmic/**'
              - 'schemas/**'
              - 'tests/fixtures/**'
              - 'docs/architecture/**'
              - 'docs/adr/0001-shared-client-core.md'
              - '.github/CODEOWNERS'
              - 'CONTRIBUTING.md'
              - 'Justfile'
              - 'config/architecture-boundaries.json'
              - 'scripts/check-client-architecture.sh'
            # Shared client changes exercise the excluded COSMIC crate headlessly;
            # the full Nix package build remains selective.
            shared_clients:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/zann-client/**'
              - 'crates/zann-client-sqlite/**'
              - 'crates/zann-core/**'
              - 'crates/zann-daemon/**'
              - 'crates/zann-autofill/**'
              - 'crates/zann-crypto/**'
              - 'crates/zann-db/**'
              - 'crates/zann-ffi/**'
              - 'crates/zann-flows/**'
              - 'crates/zann-keystore/**'
              - 'crates/zann-ui-core/**'
              - 'schemas/**'
              - 'tests/fixtures/**'
            # Everything compiled into the zann-ffi library that the native
            # Apple shell links, plus the shell itself.
            apple:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/zann-client/**'
              - 'crates/zann-client-sqlite/**'
              - 'crates/zann-core/**'
              - 'crates/zann-daemon/**'
              - 'crates/zann-autofill/**'
              - 'crates/zann-crypto/**'
              - 'crates/zann-db/**'
              - 'crates/zann-ffi/**'
              - 'crates/zann-flows/**'
              - 'crates/zann-keystore/**'
              - 'crates/zann-ui-core/**'
              - 'schemas/**'
              - 'apps/apple/**'
            # Полная Nix-сборка libcosmic с wgpu занимает десятки минут,
            # поэтому здесь только исходники и упаковка COSMIC. Совместимость
            # с crates/** закрывает headless job cosmic-rust-consumer.
            cosmic:
              - 'apps/cosmic/**'
              - 'assets/icons/**'
              - 'flake.nix'
              - 'flake.lock'
            nix_module:
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - name: Rust cache
        uses: ./.github/actions/rust-cache
      - name: Rust fmt
        run: cargo fmt --check

  # Enforce native-shell application boundaries and reject copied core code.
  layering:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.cosmic == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Client layering guard
        run: scripts/check-client-layering.sh

  cosmic:
    needs: changes
    if: needs.changes.outputs.cosmic == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libexpat1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev
      # libcosmic needs a newer rustc than rust-toolchain.toml pins for the
      # workspace; apps/cosmic/rust-toolchain.toml overrides it for this tree.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check
        working-directory: apps/cosmic
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: apps/cosmic
        run: cargo test

  audit-surface:
    needs: changes
    if: needs.changes.outputs.audit_surface == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # hidapi собирает C-часть для FIDO2-ключей (zann-keystore) и требует
      # заголовки libudev; на ubuntu-latest их нет.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - name: Rust cache
        uses: ./.github/actions/rust-cache
      - name: Dependency guard
        run: scripts/check-audit-surface-deps.sh
      - name: Clippy (audit-surface)
        run: cargo clippy -p zann-autofill -p zann-crypto -p zann-core -p zann-server -p zann-keystore --all-targets -- -D warnings
      - name: Clippy (client security core)
        run: cargo clippy -p zann-client --no-default-features --features remote,os-credentials --all-targets --locked -- -D warnings
      - name: Clippy (native secret generator and FFI projection)
        run: cargo clippy -p zann-ui-core -p zann-ffi --all-targets --locked -- -D warnings
      - name: Tests (native secret generator and FFI projection)
        run: cargo test -p zann-flows -p zann-ui-core -p zann-ffi --locked
      - name: Clippy (authenticated session surface)
        run: cargo clippy -p zann-client --no-default-features --features session --all-targets --locked -- -D warnings
      - name: Clippy (DB-free sync surface)
        run: cargo clippy -p zann-client --no-default-features --features sync --all-targets --locked -- -D warnings
      - name: Clippy (DB-free application facade)
        run: cargo clippy -p zann-client --no-default-features --features app --all-targets --locked -- -D warnings
      - name: Clippy (pull-only SQLite sync adapter)
        run: cargo clippy -p zann-client-sqlite --all-targets --locked -- -D warnings
      - name: Clippy (SQLite persistence seams)
        run: cargo clippy -p zann-db --no-default-features --features sqlite --all-targets --locked -- -D warnings
      - name: Clippy (local IPC and native host)
        run: cargo clippy -p zann-daemon -p zann-native-host -p zann-browser --all-features --all-targets --locked -- -D warnings
      - name: Tests (local IPC and native host)
        run: cargo test -p zann-daemon -p zann-native-host -p zann-crypto --all-features --locked
      - name: Tests (native framing isolation)
        run: cargo test -p zann-client --no-default-features --features native-messaging --test native_messaging --locked
      - name: Tests (audit-surface)
        run: cargo test -p zann-crypto -p zann-autofill -p zann-keystore --locked
      - name: Tests (pull-only SQLite sync adapter)
        run: cargo test -p zann-client-sqlite --locked
      - name: Tests (SQLite sync and path seams)
        run: cargo test -p zann-db --no-default-features --features sqlite --locked --test local_sqlite_path --test local_sync_transactions --test local_vault_migration --test server_replicas_migration --test local_history --test local_payload_versions

  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install extension test dependencies
        working-directory: apps/extension
        run: bun install --frozen-lockfile
      - name: Install pinned WASM packaging tool
        run: cargo install wasm-bindgen-cli --version 0.2.106 --locked
      - name: Build extension and native bridge
        run: |
          node apps/extension/build.mjs
          cargo build -p zann-native-host --locked
          cargo test -p zann-daemon --test chromium_fixture --no-run --locked
      - name: Shared browser search and usage tests
        run: cargo test -p zann-client --no-default-features --features browser-ipc --test browser_search --test browser_usage --locked
      - name: Shared login-list presentation tests
        run: cargo test -p zann-ui-core --test login_list --locked
      - name: Browser adapter boundary tests
        working-directory: apps/extension
        run: bun run test
      - name: Install test Chromium
        working-directory: apps/extension
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Chromium integration (WASM, native bridge, daemon)
        working-directory: apps/extension
        run: bun run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: zann-chromium-extension
          path: apps/extension/dist

  client-architecture:
    needs: changes
    if: needs.changes.outputs.client_architecture == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
      - name: Install architecture tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep libudev-dev
      - name: Rust cache
        uses: ./.github/actions/rust-cache
      - name: Client architecture guard
        run: scripts/check-client-architecture.sh
      - name: Check remote-only client surface
        run: cargo check -p zann-client --no-default-features --features remote --locked
      - name: Test config-only client surface
        run: cargo test -p zann-client --no-default-features --features config --locked
      - name: Lint config-only client surface
        run: cargo clippy -p zann-client --no-default-features --features config --all-targets --locked -- -D warnings
      - name: Check CLI-facing client surface
        run: cargo check -p zann-client --no-default-features --features remote,config --locked
      - name: Check authenticated session surface
        run: cargo check -p zann-client --no-default-features --features session --locked
      - name: Test authenticated session surface
        run: cargo test -p zann-client --no-default-features --features session --lib --locked
      - name: Check DB-free sync surface
        run: cargo check -p zann-client --no-default-features --features sync --locked
      - name: Test DB-free sync surface
        run: cargo test -p zann-client --no-default-features --features sync --lib --locked
      - name: Lint DB-free sync surface
        run: cargo clippy -p zann-client --no-default-features --features sync --all-targets --locked -- -D warnings
      - name: Test DB-free application facade
        run: cargo test -p zann-client --no-default-features --features app --lib --locked
      - name: Lint DB-free application facade
        run: cargo clippy -p zann-client --no-default-features --features app --all-targets --locked -- -D warnings
      - name: Test pull-only SQLite sync adapter
        run: cargo test -p zann-client-sqlite --locked
      - name: Lint pull-only SQLite sync adapter
        run: cargo clippy -p zann-client-sqlite --all-targets --locked -- -D warnings
      - name: Test canonical client/FFI feature-unification regression
        run: cargo test -p zann-ffi --test client_surface_coexistence --locked
      - name: Test OS credential adapter surface
        run: cargo test -p zann-client --no-default-features --features os-credentials --locked
      - name: Test thin OS secret-store surface
        run: cargo test -p zann-keystore --no-default-features --features secret-store --all-targets --locked

  client-locking-portability:
    needs: changes
    if: needs.changes.outputs.client_architecture == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
      - name: Rust cache
        uses: ./.github/actions/rust-cache
      - name: Test portable client process locks
        run: cargo test -p zann-client --no-default-features --features auth-lock --lib config::locking::tests --locked

  # Builds the ZannCoreKit XCFramework (macOS, iOS, iOS simulator), runs its
  # binding tests on macOS, links them for both iOS slices, then builds and
  # tests the macOS app generated from apps/apple/project.yml.
  apple:
    needs: changes
    if: needs.changes.outputs.apple == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Rust cache
        uses: ./.github/actions/rust-cache
      - name: Build ZannFFI.xcframework and Swift bindings
        run: apps/apple/ZannCoreKit/build-xcframework.sh debug
      - name: Test ZannCoreKit on macOS
        run: swift test --package-path apps/apple/ZannCoreKit
      - name: Link ZannCoreKit tests for iOS
        working-directory: apps/apple/ZannCoreKit
        run: |
          xcodebuild build-for-testing -quiet -scheme ZannCoreKit \
            -destination 'generic/platform=iOS' -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO
          # The simulator slice is arm64 only.
          xcodebuild build-for-testing -quiet -scheme ZannCoreKit \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/xcode \
            ARCHS=arm64
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test the macOS app
        working-directory: apps/apple
        run: |
          xcodegen --spec project.yml
          xcodebuild test -quiet -project Zann.xcodeproj -scheme Zann \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build
      - name: Upload Apple test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-test-results
          path: apps/apple/build/Logs/Test/*.xcresult
          retention-days: 7

  # COSMIC is outside the root workspace; shared API changes require its own
  # headless Rust consumer check in addition to native-shell source changes.
  cosmic-rust-consumer:
    needs: changes
    if: needs.changes.outputs.shared_clients == 'true' || needs.changes.outputs.cosmic == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Override the repository's 1.92 rust-toolchain for libcosmic's newer MSRV.
      RUSTUP_TOOLCHAIN: stable
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libexpat1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libvulkan-dev
      # libcosmic's MSRV is newer than the workspace pin.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          use-sccache: "true"
      - name: Test COSMIC Rust consumer
        run: cargo test --manifest-path apps/cosmic/Cargo.toml --lib --tests --locked
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    env:
      ZANN_CONFIG_PATH: config/ci.yaml
      ZANN_DB_URL: postgres://zann:zann@127.0.0.1:5432/zann
      TEST_DATABASE_URL: postgres://zann:zann@127.0.0.1:5432/zann
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 2G
      CARGO_PROFILE_TEST_DEBUG: "0"
    services:
      postgres:
        image: docker.io/library/postgres:16
        env:
          POSTGRES_USER: zann
          POSTGRES_PASSWORD: zann
          POSTGRES_DB: zann
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zann -d zann"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h
      # hidapi собирает C-часть для FIDO2-ключей (zann-keystore) и требует
      # заголовки libudev; на ubuntu-latest их нет.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          use-sccache: "true"
      - name: sccache version
        run: sccache --version
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Migrate DB
        run: |
          cargo run -p zann-server --bin zann-server -- migrate
      - name: Tests
        run: cargo test
      - name: Tests (zann-server Postgres)
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test -p zann-server -p zann-integration-tests --features postgres-tests -- --test-threads=1
      - name: Tests (zann-db Postgres)
        run: cargo test -p zann-db --features postgres
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  coverage:
    needs: changes
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      ZANN_CONFIG_PATH: config/ci.yaml
      ZANN_DB_URL: postgres://zann:zann@127.0.0.1:5432/zann
      TEST_DATABASE_URL: postgres://zann:zann@127.0.0.1:5432/zann
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
      CARGO_INCREMENTAL: "0"
    services:
      postgres:
        image: docker.io/library/postgres:16
        env:
          POSTGRES_USER: zann
          POSTGRES_PASSWORD: zann
          POSTGRES_DB: zann
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zann -d zann"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h
      # hidapi собирает C-часть для FIDO2-ключей (zann-keystore) и требует
      # заголовки libudev; на ubuntu-latest их нет.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: llvm-tools-preview
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          use-sccache: "true"
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Migrate DB
        run: |
          cargo run -p zann-server --bin zann-server -- migrate
      - name: Coverage
        run: |
          cargo llvm-cov --workspace --all-features --summary-only | tee /tmp/coverage.txt
          {
            echo "## Coverage"
            echo
            echo '```'
            cat /tmp/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    needs: changes
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # cargo-audit is built from source, and its dependencies now
      # need a newer rustc than the 1.92 pinned in rust-toolchain.toml. This
      # job only reads Cargo.lock, so the toolchain it uses says nothing about
      # how the project itself is built.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked
      # This job is the required check; avoid a second Check API publication.
      - name: Security audit
        run: cargo audit --file Cargo.lock

  # Package evaluation and build are required: source tests do not prove packaging.
  cosmic-package:
    needs: changes
    if: needs.changes.outputs.cosmic == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            ssl-cert-file = /etc/ssl/certs/ca-certificates.crt
            connect-timeout = 30
            stalled-download-timeout = 90
      # Дёшево и ловит опечатки в выражении и пропавшие атрибуты.
      - name: Evaluate the flake
        run: nix flake check --no-build
      # Сборка libcosmic не влезает в свободное место раннера рядом с
      # предустановленными образами.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Build the package
        env:
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          NIX_SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: nix build .#zann-cosmic --no-link --print-build-logs

  nix-module:
    needs: changes
    if: needs.changes.outputs.nix_module == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate flake checks
        run: nix flake check --no-build
      - name: Run Zann delivery VM smoke test
        run: nix build .#checks.x86_64-linux.zann-delivery-vm --no-link --print-build-logs
      - name: Run Zann delivery real-server VM integration test
        run: nix build .#checks.x86_64-linux.zann-delivery-real-server-vm --no-link --print-build-logs

  licenses:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  server-image:
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    env:
      COMPOSE_PROJECT_NAME: zann_quickstart
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve image name
        id: meta
        run: |
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}/zann-server:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -f crates/zann-server/Dockerfile -t "${{ steps.meta.outputs.image }}" .
      - name: Smoke test local Compose quickstart
        id: quickstart
        run: |
          ./scripts/dev-up.sh
          test "$(stat -c '%a' .env)" = 600
          curl --fail --silent --show-error --max-time 5 --retry 30 --retry-all-errors --retry-max-time 60 --retry-delay 1 http://localhost:8080/health
      - name: Compose diagnostics
        if: failure() && steps.quickstart.outcome == 'failure'
        run: docker compose logs --no-color
      - name: Stop quickstart stack
        if: always() && steps.quickstart.outcome != 'skipped'
        run: docker compose down -v
      - name: Push image
        run: docker push "${{ steps.meta.outputs.image }}"

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (needs.changes.outputs.server == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci == 'true')
    needs: [changes, server-image]
    env:
      DOCKERHUB_HOST: docker.io
      DOCKER_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/zann-server
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_PASS" | docker login "$DOCKERHUB_HOST" -u "$DOCKERHUB_USER" --password-stdin

      - name: Pull image from GHCR
        run: docker pull "${{ needs.server-image.outputs.image }}"

      - name: Tag commit image
        run: docker tag "${{ needs.server-image.outputs.image }}" "$DOCKER_IMAGE:${{ github.sha }}"

      - name: Tag
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            docker tag "$DOCKER_IMAGE:${{ github.sha }}" "$DOCKER_IMAGE:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            docker tag "$DOCKER_IMAGE:${{ github.sha }}" "$DOCKER_IMAGE:${GITHUB_REF_NAME}"
          fi

      - name: Push
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          docker push "$DOCKER_IMAGE:${{ github.sha }}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            docker push "$DOCKER_IMAGE:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            docker push "$DOCKER_IMAGE:${GITHUB_REF_NAME}"
          fi

  # One stable status for path-filtered jobs. Every job below must succeed or
  # be deliberately skipped; failures and cancellations remain failures.
  ci:
    name: ci
    if: ${{ always() && !cancelled() }}
    needs:
      - changes
      - fmt
      - layering
      - cosmic
      - audit-surface
      - client-architecture
      - extension
      - client-locking-portability
      - apple
      - cosmic-rust-consumer
      - cosmic-package
      - nix-module
      - test
      - coverage
      - audit
      - licenses
      - server-image
      - docker
    runs-on: ubuntu-latest
    steps:
      - name: Confirm jobs succeeded or were skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["RESULTS"])
          bad = [
              name
              for name, job in needs.items()
              if job.get("result") not in ("success", "skipped")
          ]
          if bad:
              print("failed jobs:", ", ".join(bad))
              sys.exit(1)
          print("all required jobs passed")
          PY
