name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      rust: ${{ steps.filter.outputs.rust }}
      server: ${{ steps.filter.outputs.server }}
      docker: ${{ steps.filter.outputs.docker }}
      js: ${{ steps.filter.outputs.js }}
      audit_surface: ${{ steps.filter.outputs.audit_surface }}
      client_architecture: ${{ steps.filter.outputs.client_architecture }}
      shared_clients: ${{ steps.filter.outputs.shared_clients }}
      cosmic: ${{ steps.filter.outputs.cosmic }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - '**/*.md'
              - '.github/pull_request_template.md'
              - '.github/ISSUE_TEMPLATE/**'
            rust:
              - 'crates/**'
              - 'tests/fixtures/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'rust-toolchain.toml'
              - 'apps/desktop/src-tauri/**'
            server:
              - 'crates/zann-server/**'
              - 'config/**'
              - 'compose.yaml'
              - 'compose.e2e.yaml'
            docker:
              - 'crates/zann-server/Dockerfile'
              - '.dockerignore'
              - 'compose.yaml'
              - 'compose.e2e.yaml'
            js:
              - 'apps/desktop/**'
              - 'bun.lockb'
              - 'apps/desktop/bun.lock'
            audit_surface:
              - 'crates/zann-crypto/**'
              - 'tests/fixtures/crypto/**'
              - 'crates/zann-core/src/auth.rs'
              - 'crates/zann-core/src/api/auth.rs'
              - 'crates/zann-client/src/config.rs'
              - 'crates/zann-client/src/config/locking.rs'
              - 'crates/zann-client/src/config/v2.rs'
              - 'crates/zann-client/src/credentials.rs'
              - 'crates/zann-client/src/identity.rs'
              - 'crates/zann-client/src/probe.rs'
              - 'crates/zann-client/src/remote.rs'
              - 'crates/zann-client/src/remote/auth.rs'
              - 'crates/zann-client/src/remote/trust.rs'
              - 'crates/zann-client/src/session.rs'
              - 'crates/zann-client/src/app.rs'
              - 'crates/zann-client/src/sync/**'
              - 'crates/zann-client/tests/config_v2.rs'
              - 'crates/zann-client-sqlite/**'
              - 'crates/zann-db/src/lib.rs'
              - 'crates/zann-db/src/local/bounded_read.rs'
              - 'crates/zann-db/src/local/item_repo.rs'
              - 'crates/zann-db/src/local/mod.rs'
              - 'crates/zann-db/src/local/pending_change_repo.rs'
              - 'crates/zann-db/src/local/storage_repo.rs'
              - 'crates/zann-db/src/local/sync_cursor_repo.rs'
              - 'crates/zann-db/src/local/sync_repo.rs'
              - 'crates/zann-db/src/local/vault_repo.rs'
              - 'crates/zann-db/migrations/0002_sync_cursor_last_seq.sql'
              - 'crates/zann-db/tests/local_sqlite_path.rs'
              - 'crates/zann-db/tests/local_sync_transactions.rs'
              - 'crates/zann-db/tests/local_vault_migration.rs'
              - 'crates/zann-server/src/domains/auth/core/**'
              - 'crates/zann-server/src/domains/access_control/**'
              - 'crates/zann-server/src/infra/audit.rs'
              - 'crates/zann-keystore/**'
            # The architecture guard is intentionally cheap. Run it whenever a
            # client shell, a shared capability, or their dependency manifests
            # change so ownership rules cannot silently drift.
            client_architecture:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**/Cargo.toml'
              - 'crates/zann-client/**'
              - 'crates/zann-client-sqlite/**'
              - 'crates/zann-cli/**'
              - 'crates/zann-core/**'
              - 'crates/zann-crypto/**'
              - 'crates/zann-db/**'
              - 'crates/zann-ffi/**'
              - 'crates/zann-keystore/**'
              - 'crates/zann-ui-core/**'
              - 'apps/desktop/src-tauri/**'
              - 'apps/cosmic/**'
              - 'schemas/**'
              - 'tests/fixtures/**'
              - 'docs/architecture/**'
              - 'docs/adr/0001-shared-client-core.md'
              - '.github/CODEOWNERS'
              - 'CONTRIBUTING.md'
              - 'Justfile'
              - 'config/architecture-boundaries.json'
              - 'scripts/check-client-architecture.sh'
            # Shared client changes must be exercised against both excluded
            # app crates. Tauri and COSMIC run headless Rust tests; the costly
            # Nix package build remains selective.
            shared_clients:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/zann-client/**'
              - 'crates/zann-client-sqlite/**'
              - 'crates/zann-core/**'
              - 'crates/zann-crypto/**'
              - 'crates/zann-db/**'
              - 'crates/zann-ffi/**'
              - 'crates/zann-keystore/**'
              - 'crates/zann-ui-core/**'
              - 'schemas/**'
              - 'tests/fixtures/**'
            # Полная Nix-сборка libcosmic с wgpu занимает десятки минут,
            # поэтому здесь только исходники и упаковка COSMIC. Совместимость
            # с crates/** закрывает headless job cosmic-rust-consumer.
            cosmic:
              - 'apps/cosmic/**'
              - 'flake.nix'
              - 'flake.lock'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - name: Rust cache
        uses: ./.github/actions/rust-cache
      - name: Rust fmt
        run: cargo fmt --check

  # The desktop backend is excluded from the workspace, so the root fmt, clippy
  # and test jobs never see its 8.5k lines. This job is what covers them until
  # ADR 0003's Ф1 brings the crate into the workspace proper.
  layering:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.js == 'true' ||
      needs.changes.outputs.cosmic == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Client layering guard
        run: scripts/check-client-layering.sh

  desktop-rust:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.js == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Tauri pulls in webkit and gtk; libudev is for zann-keystore's FIDO2 path.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libxkbcommon-dev \
            libudev-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          use-sccache: "true"
      - name: Rust fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

  # COSMIC has its own lockfile (51 git sources, which Nix vendoring depends on)
  # and needs a newer toolchain than the workspace pins, so it cannot simply
  # join the workspace — see apps/cosmic/README.md and ADR 0003.
  #
  # Shares the `cosmic` filter with cosmic-package, which deliberately leaves
  # `crates/**` out because libcosmic with wgpu takes tens of minutes (#151).
  # So this does not catch a core change breaking COSMIC either; that still
  # surfaces on the next PR touching apps/cosmic. Widening the filter is a
  # separate call about CI budget, not one to make in passing here.
  cosmic:
    needs: changes
    if: needs.changes.outputs.cosmic == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libexpat1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev
      # libcosmic needs a newer rustc than rust-toolchain.toml pins for the
      # workspace; apps/cosmic/rust-toolchain.toml overrides it for this tree.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check
        working-directory: apps/cosmic
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: apps/cosmic
        run: cargo test

  audit-surface:
    needs: changes
    if: needs.changes.outputs.audit_surface == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # hidapi собирает C-часть для FIDO2-ключей (zann-keystore) и требует
      # заголовки libudev; на ubuntu-latest их нет.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - name: Rust cache
        uses: ./.github/actions/rust-cache
      - name: Dependency guard
        run: scripts/check-audit-surface-deps.sh
      - name: Clippy (audit-surface)
        run: cargo clippy -p zann-crypto -p zann-core -p zann-server -p zann-keystore --all-targets -- -D warnings
      - name: Clippy (client security core)
        run: cargo clippy -p zann-client --no-default-features --features remote,os-credentials --all-targets --locked -- -D warnings
      - name: Clippy (authenticated session surface)
        run: cargo clippy -p zann-client --no-default-features --features session --all-targets --locked -- -D warnings
      - name: Clippy (DB-free sync surface)
        run: cargo clippy -p zann-client --no-default-features --features sync --all-targets --locked -- -D warnings
      - name: Clippy (DB-free application facade)
        run: cargo clippy -p zann-client --no-default-features --features app --all-targets --locked -- -D warnings
      - name: Clippy (pull-only SQLite sync adapter)
        run: cargo clippy -p zann-client-sqlite --all-targets --locked -- -D warnings
      - name: Clippy (SQLite persistence seams)
        run: cargo clippy -p zann-db --no-default-features --features sqlite --all-targets --locked -- -D warnings
      - name: Tests (audit-surface)
        run: cargo test -p zann-crypto
      - name: Tests (pull-only SQLite sync adapter)
        run: cargo test -p zann-client-sqlite --locked
      - name: Tests (SQLite sync and path seams)
        run: cargo test -p zann-db --no-default-features --features sqlite --locked --test local_sqlite_path --test local_sync_transactions --test local_vault_migration

  client-architecture:
    needs: changes
    if: needs.changes.outputs.client_architecture == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
      - name: Install architecture tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep libudev-dev
      - name: Rust cache
        uses: ./.github/actions/rust-cache
      - name: Client architecture guard
        run: scripts/check-client-architecture.sh
      - name: Check remote-only client surface
        run: cargo check -p zann-client --no-default-features --features remote --locked
      - name: Test config-only client surface
        run: cargo test -p zann-client --no-default-features --features config --locked
      - name: Lint config-only client surface
        run: cargo clippy -p zann-client --no-default-features --features config --all-targets --locked -- -D warnings
      - name: Check CLI-facing client surface
        run: cargo check -p zann-client --no-default-features --features remote,config --locked
      - name: Check authenticated session surface
        run: cargo check -p zann-client --no-default-features --features session --locked
      - name: Test authenticated session surface
        run: cargo test -p zann-client --no-default-features --features session --lib --locked
      - name: Check DB-free sync surface
        run: cargo check -p zann-client --no-default-features --features sync --locked
      - name: Test DB-free sync surface
        run: cargo test -p zann-client --no-default-features --features sync --lib --locked
      - name: Lint DB-free sync surface
        run: cargo clippy -p zann-client --no-default-features --features sync --all-targets --locked -- -D warnings
      - name: Test DB-free application facade
        run: cargo test -p zann-client --no-default-features --features app --lib --locked
      - name: Lint DB-free application facade
        run: cargo clippy -p zann-client --no-default-features --features app --all-targets --locked -- -D warnings
      - name: Test pull-only SQLite sync adapter
        run: cargo test -p zann-client-sqlite --locked
      - name: Lint pull-only SQLite sync adapter
        run: cargo clippy -p zann-client-sqlite --all-targets --locked -- -D warnings
      - name: Test canonical client/FFI feature-unification regression
        run: cargo test -p zann-ffi --test client_surface_coexistence --locked
      - name: Test OS credential adapter surface
        run: cargo test -p zann-client --no-default-features --features os-credentials --locked
      - name: Test thin OS secret-store surface
        run: cargo test -p zann-keystore --no-default-features --features secret-store --all-targets --locked

  client-locking-portability:
    needs: changes
    if: needs.changes.outputs.client_architecture == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
      - name: Rust cache
        uses: ./.github/actions/rust-cache
      - name: Test portable client process locks
        run: cargo test -p zann-client --no-default-features --features auth-lock --lib config::locking::tests --locked

  # Tauri is outside the root workspace, so root tests cannot catch shared API
  # or compatibility changes in its Rust adapter.
  desktop-rust-consumer:
    needs: changes
    if: needs.changes.outputs.shared_clients == 'true' || needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libxkbcommon-dev \
            libssl-dev \
            libudev-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          use-sccache: "true"
      # tauri-build validates frontendDist even though cargo check does not
      # bundle or execute the frontend.
      - name: Prepare frontend directory
        run: mkdir -p apps/desktop/dist
      - name: Test Tauri Rust consumer
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # This runs the headless COSMIC library/adapters and flow tests without
  # building the full Nix package derivation.
  cosmic-rust-consumer:
    needs: changes
    if: needs.changes.outputs.shared_clients == 'true' || needs.changes.outputs.cosmic == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Override the repository's 1.92 rust-toolchain for libcosmic's newer MSRV.
      RUSTUP_TOOLCHAIN: stable
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libexpat1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libvulkan-dev
      # libcosmic's MSRV is newer than the workspace pin.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          use-sccache: "true"
      - name: Test COSMIC Rust consumer
        run: cargo test --manifest-path apps/cosmic/Cargo.toml --lib --tests --locked
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    env:
      ZANN_CONFIG_PATH: config/ci.yaml
      ZANN_DB_URL: postgres://zann:zann@127.0.0.1:5432/zann
      TEST_DATABASE_URL: postgres://zann:zann@127.0.0.1:5432/zann
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 2G
      CARGO_PROFILE_TEST_DEBUG: "0"
    services:
      postgres:
        image: docker.io/library/postgres:16
        env:
          POSTGRES_USER: zann
          POSTGRES_PASSWORD: zann
          POSTGRES_DB: zann
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zann -d zann"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h
      # hidapi собирает C-часть для FIDO2-ключей (zann-keystore) и требует
      # заголовки libudev; на ubuntu-latest их нет.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          use-sccache: "true"
      - name: sccache version
        run: sccache --version
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Migrate DB
        run: |
          cargo run -p zann-server --bin zann-server -- migrate
      - name: Tests
        run: cargo test
      - name: Tests (zann-server Postgres)
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test -p zann-server --features postgres-tests -- --test-threads=1
      - name: Tests (zann-db Postgres)
        run: cargo test -p zann-db --features postgres
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  coverage:
    needs: changes
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      ZANN_CONFIG_PATH: config/ci.yaml
      ZANN_DB_URL: postgres://zann:zann@127.0.0.1:5432/zann
      TEST_DATABASE_URL: postgres://zann:zann@127.0.0.1:5432/zann
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
      CARGO_INCREMENTAL: "0"
    services:
      postgres:
        image: docker.io/library/postgres:16
        env:
          POSTGRES_USER: zann
          POSTGRES_PASSWORD: zann
          POSTGRES_DB: zann
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zann -d zann"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h
      # hidapi собирает C-часть для FIDO2-ключей (zann-keystore) и требует
      # заголовки libudev; на ubuntu-latest их нет.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: llvm-tools-preview
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          use-sccache: "true"
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Migrate DB
        run: |
          cargo run -p zann-server --bin zann-server -- migrate
      - name: Coverage
        run: |
          cargo llvm-cov --workspace --all-features --summary-only | tee /tmp/coverage.txt
          {
            echo "## Coverage"
            echo
            echo '```'
            cat /tmp/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    needs: changes
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
      security-events: write
    env:
      # The action builds cargo-audit from source, and its dependencies now
      # need a newer rustc than the 1.92 pinned in rust-toolchain.toml. This
      # job only reads Cargo.lock, so the toolchain it uses says nothing about
      # how the project itself is built.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Security audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Упаковка COSMIC-клиента ломается тихо: ревизия libcosmic, его git-подмодули
  # и доступность crates.io живут вне нашего кода, а обычные rust-джобы
  # деривацию не трогают вообще.
  cosmic-package:
    needs: changes
    if: needs.changes.outputs.cosmic == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Дёшево и ловит опечатки в выражении и пропавшие атрибуты.
      - name: Evaluate the flake
        run: nix flake check --no-build
      # Сборка libcosmic не влезает в свободное место раннера рядом с
      # предустановленными образами.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Build the package
        run: nix build .#zann-cosmic --no-link --print-build-logs

  licenses:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  licenses-js:
    needs: changes
    if: needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install JS deps
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Check JS licenses
        working-directory: apps/desktop
        run: bunx license-checker --production --summary --excludePrivatePackages --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Unicode-DFS-2016;Unlicense;CC0-1.0;0BSD;MPL-2.0"

  test-js:
    needs: changes
    if: needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install JS deps
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Run JS tests
        working-directory: apps/desktop
        run: bun run test

  e2e-desktop:
    needs: [changes, server-image]
    # `rust` too: the desktop backend's logic now lives in crates/zann-app, so a
    # change that breaks backup or sync no longer touches apps/desktop/** at all.
    if: >-
      needs.changes.outputs.js == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      TAURI_E2E_HEADLESS: "1"
      TAURI_E2E_ARTIFACTS_KEEP: "1"
      TAURI_E2E_SERVER_IMAGE: ${{ needs.server-image.outputs.image }}
      TAURI_E2E_BUILD_SERVER: "0"
      RUST_BACKTRACE: "1"
      TAURI_E2E_LOG_HANDLES: "1"
      TAURI_E2E_FORCE_EXIT: "1"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_LOG: debug
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libxkbcommon-dev \
            libssl-dev \
            libudev-dev \
            xvfb
          if ! sudo apt-get install -y webkit2gtk-driver; then
            sudo apt-get install -y webkit2gtk-4.1-driver
          fi
      - name: Resolve WebKitWebDriver
        run: |
          if command -v WebKitWebDriver >/dev/null 2>&1; then
            echo "TAURI_E2E_NATIVE_DRIVER=$(command -v WebKitWebDriver)" >> "$GITHUB_ENV"
          elif [ -x /usr/libexec/webkit2gtk-4.1/WebKitWebDriver ]; then
            echo "TAURI_E2E_NATIVE_DRIVER=/usr/libexec/webkit2gtk-4.1/WebKitWebDriver" >> "$GITHUB_ENV"
          elif [ -x /usr/libexec/webkit2gtk-4.0/WebKitWebDriver ]; then
            echo "TAURI_E2E_NATIVE_DRIVER=/usr/libexec/webkit2gtk-4.0/WebKitWebDriver" >> "$GITHUB_ENV"
          elif [ -x /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitWebDriver ]; then
            echo "TAURI_E2E_NATIVE_DRIVER=/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitWebDriver" >> "$GITHUB_ENV"
          elif [ -x /usr/lib/x86_64-linux-gnu/webkit2gtk-4.0/WebKitWebDriver ]; then
            echo "TAURI_E2E_NATIVE_DRIVER=/usr/lib/x86_64-linux-gnu/webkit2gtk-4.0/WebKitWebDriver" >> "$GITHUB_ENV"
          else
            echo "WebKitWebDriver not found in expected locations" >&2
            exit 1
          fi
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          use-sccache: "true"
      - name: sccache version
        run: sccache --version
      - name: Install tauri-driver
        run: cargo install tauri-driver
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull server image
        run: docker pull "${{ needs.server-image.outputs.image }}"
      - name: Install JS deps
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Build desktop app
        working-directory: apps/desktop
        run: bun run tauri build --debug --no-bundle
      - name: Run e2e tests
        working-directory: apps/desktop
        env:
          TAURI_E2E_SKIP_BUILD: "1"
        run: bun e2e
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  server-image:
    needs: changes
    if: needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve image name
        id: meta
        run: |
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}/zann-server:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -f crates/zann-server/Dockerfile -t "${{ steps.meta.outputs.image }}" .
      - name: Push image
        run: docker push "${{ steps.meta.outputs.image }}"

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (needs.changes.outputs.server == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci == 'true')
    needs: [changes, server-image]
    env:
      DOCKERHUB_HOST: docker.io
      DOCKER_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/zann-server
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_PASS" | docker login "$DOCKERHUB_HOST" -u "$DOCKERHUB_USER" --password-stdin

      - name: Pull image from GHCR
        run: docker pull "${{ needs.server-image.outputs.image }}"

      - name: Tag commit image
        run: docker tag "${{ needs.server-image.outputs.image }}" "$DOCKER_IMAGE:${{ github.sha }}"

      - name: Tag
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            docker tag "$DOCKER_IMAGE:${{ github.sha }}" "$DOCKER_IMAGE:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            docker tag "$DOCKER_IMAGE:${{ github.sha }}" "$DOCKER_IMAGE:${GITHUB_REF_NAME}"
          fi

      - name: Push
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          docker push "$DOCKER_IMAGE:${{ github.sha }}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            docker push "$DOCKER_IMAGE:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            docker push "$DOCKER_IMAGE:${GITHUB_REF_NAME}"
          fi
