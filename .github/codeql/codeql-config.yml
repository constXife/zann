name: zann

# Test code is not shipped, and scanning it produces findings that describe the
# test rather than the product: `rust/hard-coded-cryptographic-value` fires on
# every fixture password a workflow test needs to log in with, and had ninety-six
# alerts dismissed as "used in tests" before this file existed. Dismissing the
# next one by hand on every PR is not a review, it is a ritual.
#
# The cost is real and worth stating: a genuine flaw in a test helper is now
# invisible to code scanning. That is accepted because a test helper cannot be
# reached by anything but the tests.
paths-ignore:
  # Integration tests: crates/*/tests, plus the two clients that have their own.
  - "crates/*/tests/**"
  - "apps/cosmic/tests/**"
  - "apps/desktop/e2e/**"
  # Inline test modules. The convention is `src/**/tests.rs` (see AGENTS.md).
  - "**/tests.rs"
  # Performance tooling and the stub server, neither of which is shipped.
  - "loadtest/**"
  - "tools/mock-server/**"
