[advisories]
ignore = [
  "RUSTSEC-2024-0388",
  "RUSTSEC-2024-0384",
  # RUSTSEC-2026-0459 - the SQLite bundled by `libsqlite3-sys` < 0.39 can
  # return uninitialized page-cache memory when it opens a database together
  # with a crafted sibling `-wal` file of a different page size. The patched
  # `libsqlite3-sys` 0.39 is out of reach: `sqlx-sqlite` 0.8 pins `^0.30.1` and
  # 0.9 still caps it below 0.38.
  #
  # `libsqlite3-sys` reaches us through `sqlx-sqlite` <- `zann-db`, used by the
  # local client cache (`zann-client-sqlite`) and by `zann-server` tests only.
  # Every database and snapshot the client opens is one it created itself in
  # the user's own state directory. A party able to plant a database and `-wal`
  # pair there can already write the user's files, so the advisory's
  # precondition - a less trusted writer than the reader - does not arise.
  #
  # Remove once `sqlx-sqlite` accepts `libsqlite3-sys` >= 0.39, or revisit if
  # the client ever opens a SQLite file it did not create (e.g. imports one).
  "RUSTSEC-2026-0459",
]
