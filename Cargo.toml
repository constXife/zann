[workspace]
members = [
  "crates/zann-app",
  "crates/zann-client",
  "crates/zann-client-sqlite",
  "crates/zann-crypto",
  "crates/zann-core",
  "crates/zann-db",
  "crates/zann-ffi",
  "crates/zann-keystore",
  "crates/zann-server",
  "crates/zann-cli",
  "crates/zann-ui-core",
]
exclude = [
  "apps/desktop/src-tauri",
  "apps/cosmic",
  "tools/mock-server",
]
resolver = "2"

# Полный debuginfo для десяти крейтов и их дерева зависимостей — это десятки
# гигабайт в target/debug/deps и лишняя работа линкеру на каждой пересборке.
# line-tables-only оставляет читаемые бэктрейсы (файл + строка), но выкидывает
# описания типов и переменных: под отладчиком видно меньше, в панике — столько
# же. Понадобится пошаговая отладка — временно вернуть debug = true.
[profile.dev]
debug = "line-tables-only"
# Секции отладки остаются в .o рядом, а не копируются в итоговый бинарь:
# линковке нечего копировать, и она заметно дешевле.
split-debuginfo = "unpacked"

# Зависимости пересобираются редко, поэтому их дешевле держать оптимизированными:
# тесты и dev-сборки крутят чужой код (crypto, sqlite, tokio) на нормальной
# скорости, а не на debug-овской. Цена — одна полная пересборка при вводе.
[profile.dev.package."*"]
opt-level = 2
debug = false
