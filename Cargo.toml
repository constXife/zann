[workspace]
members = [
  "crates/zann-browser",
  "crates/zann-daemon",
  "crates/zann-native-host",
  "crates/zann-autofill",
  "crates/zann-client",
  "crates/zann-client-sqlite",
  "crates/zann-crypto",
  "crates/zann-passkey",
  "crates/zann-core",
  "crates/zann-db",
  "crates/zann-ffi",
  "crates/zann-flows",
  "crates/zann-keystore",
  "crates/zann-server",
  "crates/zann-cli",
  "crates/zann-ui-core",
  "crates/zann-integration-tests",
]
exclude = [
  "apps/cosmic",
  "tools/mock-server",
]
resolver = "2"

# Cargo's debuginfo stripping can produce host proc-macro dylibs rejected by
# macOS 27's loader (rust-lang/rust#157750). Preserve these build tools;
# shipped libraries retain their normal release profile.
[profile.release.build-override]
strip = "none"
